name: node-rfc compatibility gap
description: Code that worked against SAP's node-rfc does not work here.
labels: ["compatibility"]
body:
  - type: markdown
    attributes:
      value: |
        The goal is that `require("erpl-node-rfc")` is a drop-in for `require("node-rfc")`. If something
        you relied on is missing or differs, that is a defect in this library
        unless `MIGRATION.md` names it as a deliberate non-goal.
  - type: input
    id: api
    attributes:
      label: The API involved
      placeholder: "Client.getUnitState, RfcFieldType, …"
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Code that worked before
      render: javascript
    validations:
      required: true
  - type: textarea
    id: now
    attributes:
      label: What happens now
      description: The traceback, or the differing value.
    validations:
      required: true
